repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: architecture-invariants
        name: Architectural Invariants & AI Guardrails
        entry: bash -c "if [ -f src/lib/architecture.test.ts ]; then npx vitest run src/lib/architecture.test.ts; elif [ -f tests/test_architecture.py ]; then pytest tests/test_architecture.py; fi"
        language: system
        pass_filenames: false
        always_run: true
